version: '3.8'

services:
  app:
    build: .
    container_name: job-portal-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/JobPortalDB
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=tausibpatel&7796
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  db:
    image: postgres:16-alpine
    container_name: job-portal-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=JobPortalDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=tausibpatel&7796
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads:
