name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/main/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/main/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: JobPortalDB_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # The context tests boot against this database; Flyway builds the schema from V1 on start.
      - name: Test and package
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/JobPortalDB_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: ci-only-password
          # Throwaway, CI-only. Signs nothing that exists outside this job.
          JWT_SECRET: Y2ktb25seS10aHJvd2F3YXkta2V5LW5vdC11c2VkLW91dHNpZGUtZ2l0aHViLWFjdGlvbnMhIQ==
        run: ./mvnw -B clean verify

  docker:
    needs: [ frontend, backend ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t spring-job-portal:ci .
