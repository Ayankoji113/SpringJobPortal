spring.application.name=SpringJobPortal
server.port=8080
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/JobPortalDB
spring.datasource.username=postgres
# No default: the app must not start with a guessable password baked into the jar.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
# Base64, decoded by JwtService. No default: an unset signing key must fail startup,
# never silently fall back to one that is public in git history.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# App config
app.base-url=http://localhost:5173

# Email (console logger for dev - configure SMTP for production)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=noreply@jobportal.com
spring.mail.password=changeme
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.packagesToScan=com.tausib.springjobportal

# Async support (for email)
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5

# --- Grounded salary estimate (matching/SalaryEstimateService) ---
# Gemini via its OpenAI-compatible API. Key comes from the environment only; the literal default
# keeps the context bootable without a key, in which case the endpoint falls back to bare
# percentiles. Get a free-tier key at https://aistudio.google.com/apikey
spring.ai.openai.api-key=${GEMINI_API_KEY:not-set}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com
spring.ai.openai.chat.completions-path=/v1beta/openai/chat/completions
spring.ai.openai.chat.options.model=gemini-3.6-flash
spring.ai.openai.chat.options.temperature=0.2
# Gemini 3.x spends output tokens reasoning before it answers, and that budget is shared with
# the JSON we actually want. At default effort with 2048 the object came back truncated
# mid-string. Low effort is plenty for summarising four numbers, and the headroom is cheap.
spring.ai.openai.chat.options.reasoning-effort=low
spring.ai.openai.chat.options.max-tokens=4096

# How long the narrative call may take before the endpoint answers with percentiles only.
# Measured round trip is ~4s; the headroom covers a slow first call.
salary.estimate.llm-timeout-ms=15000
# Free-tier requests per minute. Over the limit the endpoint serves percentiles without asking
# the model, so a burst spends no quota. Check your own limit in AI Studio and match it.
salary.estimate.max-requests-per-minute=10
# Comparable postings pulled per query, newest first.
salary.estimate.comparable-limit=200
# TTL for the (title, location, experience) cache.
spring.cache.cache-names=salaryEstimates
spring.cache.caffeine.spec=expireAfterWrite=60m,maximumSize=1000
