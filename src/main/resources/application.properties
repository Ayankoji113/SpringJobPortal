spring.application.name=SpringJobPortal
server.port=8080
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/JobPortalDB
spring.datasource.username=postgres
# No default: the app must not start with a guessable password baked into the jar.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Schema is owned by Flyway (src/main/resources/db/migration). validate, never update: update
# never drops, so a removed column or entity lingered and a rename left both names behind.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Databases built by the old ddl-auto=update are stamped at V1 rather than having it replayed.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Email of the account promoted to ADMIN at startup, if it exists. Empty means no seeding happens.
# Set it in the git-ignored config/application.properties, alongside the JWT secret.
app.admin.email=${APP_ADMIN_EMAIL:}

# JWT Configuration
# Base64, decoded by JwtService. No default: an unset signing key must fail startup,
# never silently fall back to one that is public in git history.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${APP_UPLOAD_DIR:./uploads}

# Public URL of the frontend, used to build links in emails (verify, reset password).
app.base-url=${APP_BASE_URL:http://localhost:5173}

# Origins allowed to call the API cross-origin, comma-separated. Not needed when the jar serves
# the SPA itself (same origin); needed when the frontend is hosted elsewhere.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Email over SMTP. Sending failures are logged and swallowed (EmailService), so with no credentials
# the app runs and simply sends nothing.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
# From address on outgoing mail.
app.mail.from=${APP_MAIL_FROM:noreply@jobportal.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Swagger / OpenAPI. On for development; set SWAGGER_ENABLED=false in production to hide the API docs.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.packagesToScan=com.tausib.springjobportal

# Async support (for email)
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5

# --- Grounded salary estimate (matching/SalaryEstimateService) ---
# Gemini via its OpenAI-compatible API. Key comes from the environment only; the literal default
# keeps the context bootable without a key, in which case the endpoint falls back to bare
# percentiles. Get a free-tier key at https://aistudio.google.com/apikey
spring.ai.openai.api-key=${GEMINI_API_KEY:not-set}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com
spring.ai.openai.chat.completions-path=/v1beta/openai/chat/completions
spring.ai.openai.chat.options.model=gemini-3.6-flash
spring.ai.openai.chat.options.temperature=0.2
# Gemini 3.x spends output tokens reasoning before it answers, and that budget is shared with
# the JSON we actually want. At default effort with 2048 the object came back truncated
# mid-string. Low effort is plenty for summarising four numbers, and the headroom is cheap.
spring.ai.openai.chat.options.reasoning-effort=low
spring.ai.openai.chat.options.max-tokens=4096

# How long the narrative call may take before the endpoint answers with percentiles only.
# Measured round trip is ~4s; the headroom covers a slow first call.
salary.estimate.llm-timeout-ms=15000
# Free-tier requests per minute. Over the limit the endpoint serves percentiles without asking
# the model, so a burst spends no quota. Check your own limit in AI Studio and match it.
salary.estimate.max-requests-per-minute=10
# Comparable postings pulled per query, newest first.
salary.estimate.comparable-limit=200
# TTL for the (title, location, experience) cache.
spring.cache.cache-names=salaryEstimates
spring.cache.caffeine.spec=expireAfterWrite=60m,maximumSize=1000

# --- Operations ---
# Only health and info are exposed, both public (SecurityConfig). Health shows UP/DOWN, no details.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# Mail is best-effort, so an unreachable SMTP server must not mark the app DOWN.
management.health.mail.enabled=false

# The SPA (bundled into static/ by the Dockerfile) is served by SpaWebConfig, which also falls back
# to index.html for client-side routes. Boot's default /** static handler is turned off so the two
# do not compete.
spring.web.resources.add-mappings=false
